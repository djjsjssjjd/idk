name: Buildroot ARM64 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git bc bison flex \
            libssl-dev libncurses5-dev qemu-user-static binfmt-support \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache Buildroot
        uses: actions/cache@v4
        with:
          path: buildroot
          key: buildroot-${{ runner.os }}-${{ hashFiles('buildroot-config') }}

      - name: Clone & configure Buildroot
        run: |
          if [ ! -d "buildroot" ]; then
            git clone --depth 1 https://github.com/buildroot/buildroot.git buildroot
          fi
          cd buildroot
          make defconfig BR2_DEFCONFIG=../configs/aarch64_defconfig || make qemu_aarch64_virt_defconfig
          # Or copy your custom config:
          # cp ../my-buildroot-config .config

      - name: Build
        run: |
          cd buildroot
          make -j$(nproc)
        timeout-minutes: 120

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-images
          path: |
            buildroot/output/images/
            !buildroot/output/images/.gitkeep

      - name: Inspect output
        run: |
          ls -lah buildroot/output/images/
          file buildroot/output/images/*
          
